name: Build and Deploy CAPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build CAPA
        run: npm run build

      - name: Inspect build output
        run: |
          echo "=== dist directory ==="
          find dist -maxdepth 4 -type f | sort
          echo "=== asset file count ==="
          find dist/assets -type f 2>/dev/null | wc -l
          echo "=== output size ==="
          du -sh dist
          
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble deployment site
        run: |
          mkdir -p dist/assets
          cp -a assets/. dist/assets/

      - name: Upload generated website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
