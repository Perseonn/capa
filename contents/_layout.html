<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/css/favicon.png">
    
    <!-- Canonical Link -->
    <link rel="canonical" href="https://capa.asoh.xyz">
    
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:ital,wght@0,200..800;1,200..800&family=Faculty+Glyphic&family=Stardos+Stencil:wght@400;700&display=swap">

    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}...">

    <!-- OG Card -->
    <meta property="og:type" content="website">
    <meta property="og:image" content="{{SOCIAL_IMAGE}}">
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DESCRIPTION}}...">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="{{SOCIAL_IMAGE}}">
    <meta name="twitter:title" content="{{TITLE}}">
    <meta name="twitter:description" content="{{DESCRIPTION}}...">
    
    <!-- Bootstrap, or whichever framework you prefer, then the CSS -->
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://perseonn.github.io/font-repository/controller.css">
    <link rel="stylesheet" href="https://perseonn.github.io/font-repository/controller-ps4.css">
    <link rel="stylesheet" href="https://tetunori.github.io/fluent-emoji-webfont/dist/FluentEmojiColor.css">
    <link rel="stylesheet" href="/assets/css/fontawesome-all.min.css">
    <link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>
    <header>
        {{NAV}}
    </header>
    <main>
        {{BODY}}
    </main>
    <script src="/assets/js/bootstrap.bundle.min.js"></script>
</body>
</html>
